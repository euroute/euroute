name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Public, non-secret placeholders. The build inlines VITE_* values; these
      # are dummies so CI needs no credentials of any kind.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_PROJECT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      # Reported but not blocking: the repository currently has pre-existing
      # Prettier formatting drift in generated files (Supabase types, test
      # fixtures). Make this blocking once that has been cleaned up.
      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
